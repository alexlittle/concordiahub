[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "concordiahub"
dynamic = ["version"]
description = "ConcordiaHub dashboard and utilities"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Alex Little", email = "alex@alexlittle.net" }
]

dependencies = [
    "pandas==3.0.2",
    "scikit-learn==1.8.0",
    "numpy==2.4.4",
    "shap==0.51.0",
    "joblib==1.5.3",
    "pyarrow==24.0.0",
    "streamlit==1.57.0",
    "setuptools==81.0.0",
    "streamlit_option_menu==0.4.0",
    "sentence-transformers==5.5.0",
    "torchvision==0.27.0",
    "spacy==3.8.14",
    "plotly==6.7.0",
    "markdown==3.10.2",
    "xgboost==3.2.0",
    "itables==2.8.1"
]


[project.scripts]
concordiahub-dash = "concordiahub.cli:main"

# Tell setuptools where to find code and how to determine the version
[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["concordiahub*"]

# Interrogate settings for checking existence of doc strings
[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
fail-under = 80
verbose = 2
exclude = ["tests", "docs", "build"]

# pydoclint settings for checking correctness and consistency of docstrings
[tool.pydoclint]
style = "google"
exclude = "tests|docs"

# Read version from concordiahub/_version.py
[tool.setuptools.dynamic]
version = { attr = "concordiahub._version.__version__" }

[tool.coverage.run]
relative_files = true
source = ["concordiahub"]

[project.optional-dependencies]
examples = [
    "ollama==0.6.1",
    "jinja2==3.1.6",
    "tqdm==4.67.3"
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "twine==6.2.0",
    "build==1.4.0",
    "wheel==0.46.3",
    "pytest-cov==7.1.0",
    "pandas-stubs==3.0.3.260530",
    "Sphinx==9.1.0",
    "sphinx_rtd_theme==3.1.0",
    "interrogate==1.7.0",
    "pydoclint==0.9.1"
]
