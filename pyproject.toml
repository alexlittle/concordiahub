[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "xai_compare"
dynamic = ["version"]
description = "xaicompare dashboard and utilities"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Alex Little", email = "alex@alexlittle.net" }
]

dependencies = [
    "pandas==3.0.2",
    "scikit-learn==1.8.0",
    "numpy==2.4.4",
    "seaborn==0.13.2",
    "shap==0.51.0",
    "matplotlib==3.10.9",
    "joblib==1.5.3",
    "pyarrow==24.0.0",
    "streamlit==1.57.0",
    "setuptools==82.0.1"
]


[project.scripts]
xaicompare-dash = "xai_compare.cli:main"

# Tell setuptools where to find code and how to determine the version
[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["xai_compare*"]


# Read version from xaicompare/_version.py
[tool.setuptools.dynamic]
version = { attr = "xai_compare._version.__version__" }



[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "twine==6.2.0",
    "build==1.4.0",
    "wheel==0.46.3"
]
docs = [
    "Sphinx==9.1.0",
    "sphinx_rtd_theme==3.1.0",
]
examples = [
    "ollama==0.6.1",
    "xgboost==3.2.0",
    "jinja2==3.1.6"
]

