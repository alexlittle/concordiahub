name: CI + SonarCloud

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build-test-sonar:
    name: Build, Test, Analyze
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      actions: read
      checks: write
      # Required for SonarCloud SARIF upload
      security-events: write

    steps:
      # -------------------------
      # Checkout code
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Sonar needs full history

      # -------------------------
      # Python setup
      # -------------------------
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # -------------------------
      # Run tests + collect coverage
      # -------------------------
      - name: Run tests
        run: |
          uv run pytest --cov=concordiahub --cov-report=xml --cov-report=term

      # -------------------------
      # Upload coverage as artifact
      # -------------------------
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml

      # -------------------------
      # Docstring coverage and consistency
      # -------------------------
      - name: Docstring coverage report
        run: uv run interrogate -v concordiahub/
        continue-on-error: true # so won't fail the action

      - name: Docstring/signature consistency report
        run: uv run pydoclint concordiahub/
        continue-on-error: true # so won't fail the action

      # -------------------------
      # SonarQube Cloud scan
      # -------------------------
      - name: SonarCloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}