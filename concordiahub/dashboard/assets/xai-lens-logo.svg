<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="lens-clip">
      <circle cx="210" cy="210" r="168"/>
    </clipPath>
  </defs>

  <!-- Magnifying glass handle -->
  <line x1="338" y1="338" x2="460" y2="460" stroke="#0d4f4f" stroke-width="52" stroke-linecap="round"/>
  <!-- Handle highlight -->
  <line x1="338" y1="338" x2="452" y2="452" stroke="#166e6e" stroke-width="18" stroke-linecap="round" opacity="0.4"/>

  <!-- Lens outer ring -->
  <circle cx="210" cy="210" r="168" fill="none" stroke="#0d4f4f" stroke-width="38"/>

  <!-- Lens fill -->
  <circle cx="210" cy="210" r="149" fill="#e0f2f2"/>

  <!-- Inner ring detail -->
  <circle cx="210" cy="210" r="149" fill="none" stroke="#166e6e" stroke-width="3" opacity="0.5"/>

  <!-- XAI text — centred on circle cx/cy -->
  <text
    x="210"
    y="210"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="158"
    font-weight="normal"
    letter-spacing="4"
    fill="#0d4f4f"
  >XAI</text>

  <!-- Lens glare highlight -->
  <ellipse cx="155" cy="148" rx="38" ry="22" fill="white" opacity="0.35" transform="rotate(-35 155 148)"/>
</svg>
